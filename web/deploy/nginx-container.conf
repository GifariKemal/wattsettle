# nginx di dalam container. Traefik (Easypanel) ada di depannya, jadi file ini tidak
# bicara TLS dan tidak melakukan redirect HTTP ke HTTPS, keduanya milik edge.
#
# Security header TIDAK ditulis ulang di sini. Dockerfile menghasilkan headers.conf dari
# dist/_headers, yang juga dipakai QA suite, sehingga hanya ada satu sumber kebenaran
# untuk CSP dan kawan-kawannya. Satu-satunya tambahan adalah HSTS, sebab header itu
# hanya bermakna di origin yang melayani HTTPS.

server {
  listen 80 default_server;
  server_name web3.gifariksuryo.xyz _;

  root /usr/share/nginx/html;
  index index.html;

  # IP klien asli untuk log: hanya Traefik yang menjangkau container ini.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  real_ip_header X-Forwarded-For;

  include /etc/nginx/conf.d/headers.conf;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  # HTML selalu revalidasi supaya deploy langsung terlihat; lokasi aset di bawah
  # mendeklarasikan Cache-Control sendiri dan tidak mewarisi baris ini.
  add_header Cache-Control "no-cache" always;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  # probe uptime, tanpa body
  location = /healthz { return 204; access_log off; }

  # berkas header gaya Pages/Netlify bukan konten yang perlu diambil publik
  location = /_headers { return 404; }

  # aset ber-hash konten, aman jadi immutable
  location /_astro/ { add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }

  # $uri/index.html WAJIB mendahului $uri: kalau tidak, /demo cocok ke direktori dan
  # nginx mengembalikan 301 ke /demo/, memboroskan satu round trip di LCP.
  location / { try_files $uri/index.html $uri $uri.html =404; }
}
