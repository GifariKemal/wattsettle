[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Dipin agar bytecode reproducible dan verifikasi BscScan deterministik.
solc = "0.8.30"
optimizer = true
optimizer_runs = 200
# Shanghai dipilih (bukan cancun/prague) supaya bytecode tidak memakai MCOPY/TSTORE,
# jadi aman di semua node BSC testnet 97.
evm_version = "shanghai"

[fmt]
line_length = 120

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
