[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Dipin agar bytecode reproducible dan verifikasi BscScan deterministik.
solc = "0.8.30"
optimizer = true
optimizer_runs = 200
# Shanghai dipilih (bukan cancun/prague) supaya bytecode tidak memakai MCOPY/TSTORE,
# jadi aman di semua node BSC testnet 97.
evm_version = "shanghai"

[fmt]
line_length = 120

# fail_on_revert sengaja true. Handler invariant ditulis supaya tidak pernah revert, jadi
# kalau ada panggilan yang gagal itu tanda asumsi handler-nya keliru, bukan sesuatu yang
# boleh ditelan diam-diam. Dengan false, sebagian besar panggilan bisa gagal tanpa suara
# dan invariant lolos hanya karena tidak ada yang benar-benar terjadi.
[invariant]
runs = 256
depth = 32
fail_on_revert = true

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
